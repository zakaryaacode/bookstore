<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookstore</title>
    <!-- gsap -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/ScrollTrigger.min.js"></script>
    <!-- Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Merriweather+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
    <!-- CSS connected -->
    <link rel="stylesheet" href="jsp/variables.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="jsp/navbar&footer.css" />
    <link rel="stylesheet" href="jsp/buttons.css" />
    <link rel="stylesheet" href="style pages/home.css" />
    <link rel="stylesheet" href="jsp/responsive.css" />
  </head>
  <body>
    <!-- Home -->
    <section class="home" id="home">
      <header class="navbar">
        <div class="logo">Zaki</div>
        <div class="right-items">
          <input type="text" placeholder="Search..." class="search-input" />
          <div class="dropdown">
            <button class="dropbtn">Lan</button>
            <div class="dropdown-content">
              <button onclick="setLanguage('en')">English</button>
              <button onclick="setLanguage('fr')">Français</button>
              <button onclick="setLanguage('de')">Deutsch</button>
            </div>
          </div>
          <button class="hamburger" id="hamburger">&#9776;</button>
          <nav class="navbarr" id="navbarr">
            <a href="#home" class="home-navbar" id="home-navbar"></a>
            <a href="#store" class="store-navbar" id="store-navbar"></a>
            <a href="#test" class="test-navbar" id="test-navbar"></a>
            <a href="#about" class="about-navbar" id="about-navbar"></a>
            <a href="#contact" class="contact-navbar" id="contact-navbar"></a>
          </nav>
        </div>
      </header>
      <div class="background"></div>
      <div class="home content" id="home content">
        <img
          class="princess"
          id="princess"
          src="photo/wallpaper/ea9af7cc-7c9a-40f1-b565-c84212dab42f_removalai_preview.png"
          alt=""
        />
        <img id="quote" class="quote" src="photo/wallpaper/quote.png" alt="" />
        <h1 class="book-store" id="book-store"></h1>
        <h3 class="second-title" id="second-title"></h3>
        <p class="text" id="text"></p>
        <p class="quete"></p>
      </div>
    </section>
    <!-- Store -->
    <section class="store" id="store">
      <div class="horizontal-container">
        <div class="box">About Info 1</div>
        <div class="box">About Info 2</div>
        <div class="box">About Info 3</div>
        <div class="box">About Info 4</div>
        <div class="box">About Info 5</div>
        <div class="box">About Info 6</div>
        <div class="box">About Info 7</div>
        <div class="box">About Info 8</div>
      </div>
    </section>
    <!-- Test -->
    <section class="test" id="test"></section>

    <!-- about -->
    <section class="about" id="about"></section>
    <!-- contact -->
    <section class="contact" id="contact"></section>

    <!-- JS -->
    <script src="main.js"></script>
    <script src="dinamic pages/home.js"></script>
  </body>
</html>
